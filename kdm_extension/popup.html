<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>KDM Downloader</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #12161c;
      color: #e5e7eb;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #3b82f6;
    }
    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #1f2937;
      color: #9ca3af;
    }
    .status-badge.online {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #9ca3af;
      margin: 12px 0 6px 0;
    }
    .detected-container {
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .media-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      gap: 6px;
    }
    .media-row:last-child {
      border-bottom: none;
    }
    .media-info {
      flex: 1;
      overflow: hidden;
    }
    .media-title {
      font-weight: 600;
      font-size: 12px;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-type {
      font-size: 10px;
      color: #9ca3af;
    }
    .btn-download-media {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-download-media:hover {
      background: #1d4ed8;
    }
    .no-media {
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      padding: 8px 0;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      color: #9ca3af;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e242d;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 6px;
      font-size: 12px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="KDM">
      <span>KDM Downloader</span>
    </div>
    <div id="status-badge" class="status-badge">
      <div class="dot"></div>
      <span id="status-text">Đang kiểm tra...</span>
    </div>
  </div>

  <!-- Detected Media Streams List -->
  <div class="section-title">🎯 Video phát hiện trên trang này:</div>
  <div id="detected-container" class="detected-container">
    <div class="no-media">Đang quét luồng video (hãy bấm Play video)...</div>
  </div>

  <div class="form-group">
    <label for="url-input">Hoặc dán URL bất kỳ:</label>
    <input type="text" id="url-input" placeholder="https://... (tập tin, YouTube, TikTok, m3u8)">
    <button id="btn-download" class="btn">🚀 Tải bằng KDM</button>
  </div>

  <div class="toggle-row">
    <span>Tự động bắt link tải trên Cốc Cốc</span>
    <input type="checkbox" id="intercept-toggle" checked>
  </div>

  <script src="popup.js"></script>
</body>
</html>
